name: Frontend - validacion

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.15.0'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar Angular para produccion
        run: npm run build
