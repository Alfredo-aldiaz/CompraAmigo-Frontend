<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header class="header-center">
      <mat-card-title>CompraAmigo</mat-card-title>
      <mat-card-subtitle>Plataforma de compras sostenibles</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-tab-group [(selectedIndex)]="tabIndex" mat-stretch-tabs="true">

        <mat-tab label="Iniciar Sesión">
          <form [formGroup]="loginForm" (ngSubmit)="onSubmitLogin()" class="form-container">

            <div class="role-selector">
              <label class="role-label">Ingresar como:</label>
              <mat-button-toggle-group formControlName="tipoAcceso" aria-label="Tipo de acceso">
                <mat-button-toggle value="ROLE_USER">
                  <mat-icon>person</mat-icon> Usuario
                </mat-button-toggle>
                <mat-button-toggle value="ROLE_ADMIN">
                  <mat-icon>admin_panel_settings</mat-icon> Administrador
                </mat-button-toggle>
              </mat-button-toggle-group>
            </div>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Correo electrónico</mat-label>
              <input matInput type="email" formControlName="username" placeholder="ejemplo@correo.com" />
              <mat-icon matSuffix>email</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Contraseña</mat-label>
              <input matInput [type]="ocultarPassword ? 'password' : 'text'" formControlName="password" />
              <button mat-icon-button matSuffix type="button" (click)="ocultarPassword = !ocultarPassword">
                <mat-icon>{{ ocultarPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </mat-form-field>

            <button type="submit" mat-raised-button color="primary" class="full-width btn-action">
              Ingresar
            </button>
          </form>
        </mat-tab>

        <mat-tab label="Registrarse">
          <form [formGroup]="registerForm" (ngSubmit)="onSubmitRegister()" class="form-container">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Nombre completo</mat-label>
              <input matInput formControlName="nombre" placeholder="Tu nombre" />
              <mat-icon matSuffix>badge</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Correo electrónico</mat-label>
              <input matInput type="email" formControlName="username" placeholder="ejemplo@correo.com" />
              <mat-icon matSuffix>email</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Contraseña</mat-label>
              <input matInput [type]="ocultarPassword ? 'password' : 'text'" formControlName="password" />
              <button mat-icon-button matSuffix type="button" (click)="ocultarPassword = !ocultarPassword">
                <mat-icon>{{ ocultarPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </mat-form-field>

            <button type="submit" mat-raised-button color="accent" class="full-width btn-action">
              Crear cuenta de Usuario
            </button>
          </form>
        </mat-tab>

      </mat-tab-group>
    </mat-card-content>
  </mat-card>
</div>
