<mat-toolbar>
  <a mat-button routerLink="/home">CompraAmigo</a>
  @if (estaLogueado()) {
    <nav aria-label="Navegación principal">
      <a mat-button routerLink="/catalogo">Catálogo</a>
      @if (esUsuario()) {
        <a mat-button routerLink="/perfil">Mi perfil</a>
        <a mat-button routerLink="/carrito">Carrito</a>
        <a mat-button routerLink="/pedidos">Mis pedidos</a>
      }
      @if (esAdministrador()) {
        <a mat-button routerLink="/admin/productos">Inventario</a>
        <a mat-button routerLink="/admin/pedidos">Gestionar pedidos</a>
      }
      <button mat-button type="button" (click)="cerrarSesion()">Cerrar sesión</button>
    </nav>
  }
</mat-toolbar>
